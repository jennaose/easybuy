<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Users 014 Easy Buy</title>
  </head>
  <body>
    <h1>Active users</h1>
    <p>This is a browser-friendly list of active users. Click a username to view the profile page.</p>
    <ul>
    {% for user in users %}
      <li>
        <a href="/users/{{ user.id }}/">{{ user.username }}</a>
        — {{ user.email }}
      </li>
    {% empty %}
      <li>No active users found.</li>
    {% endfor %}
    </ul>
    <p><a href="/">Back to home</a></p>
  </body>
</html>
